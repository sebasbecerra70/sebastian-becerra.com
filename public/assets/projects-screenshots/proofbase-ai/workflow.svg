<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d0f1a"/><stop offset="100%" style="stop-color:#191430"/></linearGradient></defs><rect width="1280" height="720" fill="url(#bg)"/><rect width="1280" height="90" fill="#1e1745"/><text x="40" y="55" font-family="monospace" font-size="28" font-weight="bold" fill="#a78bfa">PROOFBASE.AI</text><text x="40" y="80" font-family="monospace" font-size="13" fill="#34d399">Submit once. Verified everywhere.</text><rect x="50" y="220" width="212" height="230" rx="10" fill="#171334" stroke="#7c5cff" stroke-width="1.5"/><circle cx="156" cy="275" r="26" fill="#7c5cff" opacity="0.15" stroke="#7c5cff" stroke-width="2"/><text x="156" y="283" font-family="monospace" font-size="18" font-weight="bold" fill="#7c5cff" text-anchor="middle">01</text><text x="156" y="335" font-family="monospace" font-size="16" font-weight="bold" fill="#f0eefc" text-anchor="middle">SUBMIT</text><text x="156" y="368" font-family="monospace" font-size="12" font-weight="normal" fill="#6f6a95" text-anchor="middle">Documents, links,</text><text x="156" y="388" font-family="monospace" font-size="12" font-weight="normal" fill="#6f6a95" text-anchor="middle">and registry IDs</text><path d="M 270 335 l 14 0" stroke="#7c5cff" stroke-width="2" stroke-linecap="round"/><path d="M 280 330 l 6 5 l -6 5" fill="none" stroke="#7c5cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="292" y="220" width="212" height="230" rx="10" fill="#171334" stroke="#a78bfa" stroke-width="1.5"/><circle cx="398" cy="275" r="26" fill="#a78bfa" opacity="0.15" stroke="#a78bfa" stroke-width="2"/><text x="398" y="283" font-family="monospace" font-size="18" font-weight="bold" fill="#a78bfa" text-anchor="middle">02</text><text x="398" y="335" font-family="monospace" font-size="16" font-weight="bold" fill="#f0eefc" text-anchor="middle">EXTRACT</text><text x="398" y="368" font-family="monospace" font-size="12" font-weight="normal" fill="#6f6a95" text-anchor="middle">LLM pulls structured</text><text x="398" y="388" font-family="monospace" font-size="12" font-weight="normal" fill="#6f6a95" text-anchor="middle">claims from sources</text><path d="M 512 335 l 14 0" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/><path d="M 522 330 l 6 5 l -6 5" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="534" y="220" width="212" height="230" rx="10" fill="#171334" stroke="#38bdf8" stroke-width="1.5"/><circle cx="640" cy="275" r="26" fill="#38bdf8" opacity="0.15" stroke="#38bdf8" stroke-width="2"/><text x="640" y="283" font-family="monospace" font-size="18" font-weight="bold" fill="#38bdf8" text-anchor="middle">03</text><text x="640" y="335" font-family="monospace" font-size="16" font-weight="bold" fill="#f0eefc" text-anchor="middle">CROSS-CHECK</text><text x="640" y="368" font-family="monospace" font-size="12" font-weight="normal" fill="#6f6a95" text-anchor="middle">Registries, issuer APIs,</text><text x="640" y="388" font-family="monospace" font-size="12" font-weight="normal" fill="#6f6a95" text-anchor="middle">reference contacts</text><path d="M 754 335 l 14 0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/><path d="M 764 330 l 6 5 l -6 5" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="776" y="220" width="212" height="230" rx="10" fill="#171334" stroke="#fbbf24" stroke-width="1.5"/><circle cx="882" cy="275" r="26" fill="#fbbf24" opacity="0.15" stroke="#fbbf24" stroke-width="2"/><text x="882" y="283" font-family="monospace" font-size="18" font-weight="bold" fill="#fbbf24" text-anchor="middle">04</text><text x="882" y="335" font-family="monospace" font-size="16" font-weight="bold" fill="#f0eefc" text-anchor="middle">HUMAN GATE</text><text x="882" y="368" font-family="monospace" font-size="12" font-weight="normal" fill="#6f6a95" text-anchor="middle">Low-confidence claims</text><text x="882" y="388" font-family="monospace" font-size="12" font-weight="normal" fill="#6f6a95" text-anchor="middle">routed to a reviewer</text><path d="M 996 335 l 14 0" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/><path d="M 1006 330 l 6 5 l -6 5" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="1018" y="220" width="212" height="230" rx="10" fill="#171334" stroke="#34d399" stroke-width="1.5"/><circle cx="1124" cy="275" r="26" fill="#34d399" opacity="0.15" stroke="#34d399" stroke-width="2"/><text x="1124" y="283" font-family="monospace" font-size="18" font-weight="bold" fill="#34d399" text-anchor="middle">05</text><text x="1124" y="335" font-family="monospace" font-size="16" font-weight="bold" fill="#f0eefc" text-anchor="middle">PUBLISH</text><text x="1124" y="368" font-family="monospace" font-size="12" font-weight="normal" fill="#6f6a95" text-anchor="middle">One shareable link,</text><text x="1124" y="388" font-family="monospace" font-size="12" font-weight="normal" fill="#6f6a95" text-anchor="middle">re-checked on a cadence</text><rect x="50" y="510" width="1180" height="150" rx="10" fill="#141229" stroke="#2d2755" stroke-width="1.5"/><text x="90" y="555" font-family="monospace" font-size="13" font-weight="bold" fill="#a78bfa" text-anchor="start">AUDIT TRAIL</text><text x="90" y="590" font-family="monospace" font-size="14" font-weight="normal" fill="#c7c3e0" text-anchor="start">Every claim stores its source document hash, the method used to verify it, the reviewer who signed off, and the timestamp.</text><text x="90" y="620" font-family="monospace" font-size="14" font-weight="normal" fill="#6f6a95" text-anchor="start">Nothing is marked verified without a traceable path back to a source - the score is only worth what the trail behind it proves.</text></svg>