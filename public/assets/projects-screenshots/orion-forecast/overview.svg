  <text x=\"1330\" y=\"590\" font-family=\"Arial\" font-size=\"12\" font-weight=\"bold\" fill=\"#00d4ff\">Model Info</text>
  <text x=\"1330\" y=\"615\" font-family=\"Arial\" font-size=\"10\" fill=\"white\">Version: 1.4.2</text>
  <text x=\"1330\" y=\"635\" font-family=\"Arial\" font-size=\"10\" fill=\"white\">Released: 2024-01-15</text>
  <text x=\"1330\" y=\"655\" font-family=\"Arial\" font-size=\"10\" fill=\"white\">Framework: PyTorch 2.0</text>
  <text x=\"1330\" y=\"675\" font-family=\"Arial\" font-size=\"10\" fill=\"#00d4ff\">Prod: Active</text>
  <rect x=\"0\" y=\"960\" width=\"1600\" height=\"40\" fill=\"rgba(0,0,0,0.3)\"/>
  <text x=\"60\" y=\"985\" font-family=\"Arial, sans-serif\" font-size=\"11\" fill=\"rgba(255,255,255,0.5)\">Last updated: Today at 14:32 UTC</text>
  <text x=\"1450\" y=\"985\" font-family=\"Arial, sans-serif\" font-size=\"11\" fill=\"#00d4ff\">All systems healthy</text>
