  <text x="1045" y="185" font-family="Arial, sans-serif" font-size="13" fill="#00d4ff" font-weight="bold">Throughput</text>
  <text x="1045" y="240" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#00d4ff">8.4K</text>
  <text x="1045" y="260" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">requests/second</text>
