  <text x=\"130\" y=\"615\" font-family=\"Arial\" font-size=\"10\" fill=\"white\">Loss: 0.0234 | Validation: 96.8%</text>
  <text x=\"130\" y=\"635\" font-family=\"Arial\" font-size=\"10\" fill=\"white\">Epoch: 148/200 | Time: 8.4h</text>
  <text x=\"130\" y=\"655\" font-family=\"Arial\" font-size=\"10\" fill=\"white\">Learning rate: 1.2e-5 (adaptive)</text>
  <text x=\"130\" y=\"675\" font-family=\"Arial\" font-size=\"10\" fill=\"#00d4ff\">Status: Converging well</text>
  <!-- Model Deployment -->
  <rect x=\"500\" y=\"560\" width=\"340\" height=\"140\" fill=\"rgba(0,212,255,0.1)\" rx=\"8\"/>
  <text x=\"530\" y=\"590\" font-family=\"Arial\" font-size=\"12\" font-weight=\"bold\" fill=\"#00d4ff\">Inference Optimization</text>
  <text x=\"530\" y=\"615\" font-family=\"Arial\" font-size=\"10\" fill=\"white\">Quantization: INT8 enabled</text>
  <text x=\"530\" y=\"635\" font-family=\"Arial\" font-size=\"10\" fill=\"white\">Pruning: 35% weights removed</text>
  <text x=\"530\" y=\"655\" font-family=\"Arial\" font-size=\"10\" fill=\"white\">Batch Size: 256 | Precision: FP16</text>
  <text x=\"530\" y=\"675\" font-family=\"Arial\" font-size=\"10\" fill=\"#00d4ff\">Memory: 2.1GB | Speed: 8.4K req/s</text>
  <!-- Hardware Utilization -->
  <rect x=\"900\" y=\"560\" width=\"340\" height=\"140\" fill=\"rgba(0,212,255,0.1)\" rx=\"8\"/>
  <text x=\"930\" y=\"590\" font-family=\"Arial\" font-size=\"12\" font-weight=\"bold\" fill=\"#00d4ff\">Hardware Utilization</text>
  <text x=\"930\" y=\"615\" font-family=\"Arial\" font-size=\"10\" fill=\"white\">GPU Memory: 82% • Core: 78%</text>
  <text x=\"930\" y=\"635\" font-family=\"Arial\" font-size=\"10\" fill=\"white\">CPU: 45% • Network I/O: 62%</text>
  <text x=\"930\" y=\"655\" font-family=\"Arial\" font-size=\"10\" fill=\"white\">Temp: 68°C • Power: 280W</text>
  <text x=\"930\" y=\"675\" font-family=\"Arial\" font-size=\"10\" fill=\"#00d4ff\">Efficiency: Optimal</text>
  <!-- Model Versioning -->
