  <circle cx=\"990\" cy=\"460\" r=\"25\" fill=\"rgba(0,212,255,0.2)\" stroke=\"#00d4ff\" stroke-width=\"2\"/>
  <text x=\"990\" y=\"465\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"8\" font-weight=\"bold\" fill=\"#00d4ff\">LayerNorm</text>
