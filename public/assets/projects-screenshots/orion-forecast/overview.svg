      <stop offset="0%" style="stop-color:#0a0f1f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1629;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2139;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#151a2f;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bgGradient)"/>
  <rect width="1600" height="120" fill="url(#headerGrad)"/>
  <text x="60" y="75" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white">Orion</text>
  <text x="60" y="110" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.8)">AI Model Architecture Dashboard</text>
  <rect x="60" y="150" width="280" height="140" rx="12" fill="url(#cardGrad)" stroke="#00d4ff" stroke-width="2"/>
  <text x="85" y="185" font-family="Arial, sans-serif" font-size="13" fill="#00d4ff" font-weight="bold">Model Accuracy</text>
  <text x="85" y="240" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#00d4ff">96.8%</text>
  <text x="85" y="260" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">↑ 2.3% improvement</text>
  <rect x="380" y="150" width="280" height="140" rx="12" fill="url(#cardGrad)" stroke="#00d4ff" stroke-width="2"/>
  <text x="405" y="185" font-family="Arial, sans-serif" font-size="13" fill="#00d4ff" font-weight="bold">Parameters</text>
  <text x="405" y="240" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#00d4ff">2.1B</text>
  <text x="405" y="260" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">2.1 billion learnable</text>
  <rect x="700" y="150" width="280" height="140" rx="12" fill="url(#cardGrad)" stroke="#00d4ff" stroke-width="2"/>
  <text x="725" y="185" font-family="Arial, sans-serif" font-size="13" fill="#00d4ff" font-weight="bold">Latency</text>
  <text x="725" y="240" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#00d4ff">42ms</text>
  <text x="725" y="260" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">↓ 15% faster inference</text>
