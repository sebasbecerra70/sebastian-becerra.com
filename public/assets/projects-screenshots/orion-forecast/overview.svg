  <text x=\"710\" y=\"463\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"9\" font-weight=\"bold\" fill=\"#00d4ff\">Multi-Head</text>
  <text x=\"710\" y=\"478\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"8\" fill=\"#00d4ff\">Attention</text>
  <!-- Connection -->
  <path d=\"M 650 460 L 680 460\" stroke=\"#00d4ff\" stroke-width=\"2\"/>
  <!-- Dense Layers -->
  <rect x=\"800\" y=\"410\" width=\"130\" height=\"100\" fill=\"rgba(0,212,255,0.15)\" rx=\"4\" stroke=\"#00d4ff\" stroke-width=\"1\"/>
  <text x=\"865\" y=\"440\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"11\" font-weight=\"bold\" fill=\"#00d4ff\">Dense Layers</text>
  <text x=\"865\" y=\"458\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"9\" fill=\"rgba(255,255,255,0.7)\">1024→512</text>
  <text x=\"865\" y=\"475\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"8\" fill=\"rgba(255,255,255,0.6)\">w/Dropout</text>
  <!-- Connection -->
  <path d=\"M 740 460 L 800 460\" stroke=\"#00d4ff\" stroke-width=\"2\"/>
