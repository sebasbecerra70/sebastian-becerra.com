  <text x=\"585\" y=\"458\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"9\" fill=\"rgba(255,255,255,0.7)\">Block 2-4</text>
  <text x=\"585\" y=\"475\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"8\" fill=\"rgba(255,255,255,0.6)\">96 heads</text>
