  <text x="1360" y="185" font-family="Arial, sans-serif" font-size="13" fill="#00d4ff" font-weight="bold">GPU Util</text>
  <text x="1360" y="235" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#00d4ff\">82%</text>
  <text x="1360" y="260" font-family=\"Arial\" font-size=\"11\" fill=\"rgba(255,255,255,0.6)\">Optimized</text>
  <rect x=\"60\" y=\"330\" width=\"1480\" height=\"600\" rx=\"12\" fill=\"url(#cardGrad)\" stroke=\"#00d4ff\" stroke-width=\"1\" opacity=\"0.8\"/>
  <text x=\"100\" y=\"375\" font-family=\"Arial, sans-serif\" font-size=\"18\" font-weight=\"bold\" fill=\"#00d4ff\">Neural Network Architecture</text>
  <!-- Input Layer -->
