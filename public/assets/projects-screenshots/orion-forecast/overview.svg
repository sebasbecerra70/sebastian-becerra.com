  <rect x=\"1080\" y=\"410\" width=\"130\" height=\"100\" fill=\"rgba(0,212,255,0.15)\" rx=\"4\" stroke=\"#00d4ff\" stroke-width=\"1\"/>
  <text x=\"1145\" y=\"440\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"11\" font-weight=\"bold\" fill=\"#00d4ff\">Classification</text>
  <text x=\"1145\" y=\"458\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"9\" fill=\"rgba(255,255,255,0.7)\">Softmax</text>
  <text x=\"1145\" y=\"475\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"8\" fill=\"rgba(255,255,255,0.6)\">1024 classes</text>
  <!-- Connection -->
  <path d=\"M 1015 460 L 1080 460\" stroke=\"#00d4ff\" stroke-width=\"2\"/>
  <!-- Output Layer -->
  <rect x=\"1280\" y=\"420\" width=\"120\" height=\"80\" fill=\"rgba(0,212,255,0.15)\" rx=\"4\" stroke=\"#00d4ff\" stroke-width=\"1\"/>
  <text x=\"1340\" y=\"450\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"11\" font-weight=\"bold\" fill=\"#00d4ff\">Output</text>
  <text x=\"1340\" y=\"470\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"9\" fill=\"rgba(255,255,255,0.7)\">Predictions</text>
