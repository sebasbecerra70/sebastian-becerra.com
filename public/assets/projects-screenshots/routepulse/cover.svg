<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="routeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:0.05" />
    </linearGradient>
    <filter id="glowRoute">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="720" fill="#0a2520"/>
  <rect width="1280" height="720" fill="url(#routeGradient)"/>
  
  <!-- Header -->
  <rect width="1280" height="80" fill="#0d3f39"/>
  <rect width="1280" height="2" fill="#14b8a6"/>
  
  <!-- Title -->
  <text x="60" y="55" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#14b8a6">
    RoutePulse
  </text>
  <text x="60" y="72" font-family="system-ui, sans-serif" font-size="13" fill="#14b8a6" opacity="0.6">
    Advanced Logistics & Delivery Management
  </text>
  
  <!-- Metrics Grid -->
  <!-- Active Routes Card -->
  <g filter="url(#glowRoute)">
    <rect x="60" y="120" width="270" height="140" fill="#0d3f39" stroke="#14b8a6" stroke-width="1" rx="8"/>
    <text x="80" y="145" font-family="system-ui, sans-serif" font-size="13" fill="#14b8a6" opacity="0.7">Active Routes</text>
    <text x="80" y="180" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#14b8a6">847</text>
    <text x="80" y="225" font-family="system-ui, sans-serif" font-size="12" fill="#888">↑ 3.2% from yesterday</text>
  </g>
  
  <!-- Delivery Success Card -->
  <g filter="url(#glowRoute)">
    <rect x="360" y="120" width="270" height="140" fill="#0d3f39" stroke="#14b8a6" stroke-width="1" rx="8"/>
    <text x="380" y="145" font-family="system-ui, sans-serif" font-size="13" fill="#14b8a6" opacity="0.7">Delivery Success</text>
    <text x="380" y="180" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#14b8a6">96.3%</text>
    <text x="380" y="225" font-family="system-ui, sans-serif" font-size="12" fill="#888">On-time completion rate</text>
  </g>
  
  <!-- Avg Transit Card -->
  <g filter="url(#glowRoute)">
    <rect x="660" y="120" width="270" height="140" fill="#0d3f39" stroke="#14b8a6" stroke-width="1" rx="8"/>
    <text x="680" y="145" font-family="system-ui, sans-serif" font-size="13" fill="#14b8a6" opacity="0.7">Avg Transit Time</text>
    <text x="680" y="180" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#14b8a6">2.1d</text>
    <text x="680" y="225" font-family="system-ui, sans-serif" font-size="12" fill="#888">Average delivery window</text>
  </g>
  
  <!-- Fleet Status Card -->
  <g filter="url(#glowRoute)">
    <rect x="960" y="120" width="260" height="140" fill="#0d3f39" stroke="#14b8a6" stroke-width="1" rx="8"/>
    <text x="980" y="145" font-family="system-ui, sans-serif" font-size="13" fill="#14b8a6" opacity="0.7">Fleet Status</text>
    <text x="980" y="180" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#14b8a6">87%</text>
    <text x="980" y="225" font-family="system-ui, sans-serif" font-size="12" fill="#888">Operational capacity</text>
  </g>
  
  <!-- Network Map Visualization -->
  <g>
    <text x="60" y="305" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e0e0e0">
      Delivery Network Overview
    </text>
    
    <!-- Map Background -->
    <rect x="60" y="330" width="1160" height="350" fill="#0d3f39" stroke="#14b8a6" stroke-width="1" rx="8" opacity="0.5"/>
    
    <!-- Network Lines -->
    <line x1="200" y1="450" x2="500" y2="480" stroke="#14b8a6" stroke-width="1.5" opacity="0.4"/>
    <line x1="500" y1="480" x2="800" y2="420" stroke="#14b8a6" stroke-width="1.5" opacity="0.4"/>
    <line x1="200" y1="450" x2="300" y2="580" stroke="#14b8a6" stroke-width="1.5" opacity="0.4"/>
    <line x1="500" y1="480" x2="600" y2="600" stroke="#14b8a6" stroke-width="1.5" opacity="0.4"/>
    <line x1="800" y1="420" x2="1050" y2="520" stroke="#14b8a6" stroke-width="1.5" opacity="0.4"/>
    <line x1="800" y1="420" x2="950" y2="380" stroke="#14b8a6" stroke-width="1.5" opacity="0.4"/>
    
    <!-- Hub Nodes (Delivery Centers) -->
    <circle cx="200" cy="450" r="12" fill="#14b8a6" opacity="0.8"/>
    <circle cx="200" cy="450" r="18" fill="#14b8a6" opacity="0.2"/>
    <text x="210" y="458" font-family="system-ui, sans-serif" font-size="11" fill="#14b8a6">Hub 1</text>
    
    <circle cx="500" cy="480" r="14" fill="#14b8a6" opacity="0.8"/>
    <circle cx="500" cy="480" r="20" fill="#14b8a6" opacity="0.2"/>
    <text x="510" y="488" font-family="system-ui, sans-serif" font-size="11" fill="#14b8a6">Hub 2</text>
    
    <circle cx="800" cy="420" r="14" fill="#14b8a6" opacity="0.8"/>
    <circle cx="800" cy="420" r="20" fill="#14b8a6" opacity="0.2"/>
    <text x="810" y="428" font-family="system-ui, sans-serif" font-size="11" fill="#14b8a6">Hub 3</text>
    
    <!-- Delivery Points -->
    <circle cx="300" cy="580" r="8" fill="#14b8a6" opacity="0.6"/>
    <circle cx="600" cy="600" r="8" fill="#14b8a6" opacity="0.6"/>
    <circle cx="950" cy="380" r="8" fill="#14b8a6" opacity="0.6"/>
    <circle cx="1050" cy="520" r="8" fill="#14b8a6" opacity="0.6"/>
    <circle cx="350" cy="380" r="8" fill="#14b8a6" opacity="0.6"/>
    <circle cx="750" cy="550" r="8" fill="#14b8a6" opacity="0.6"/>
    
    <!-- Legend -->
    <circle cx="70" cy="690" r="5" fill="#14b8a6"/>
    <text x="85" y="695" font-family="system-ui, sans-serif" font-size="11" fill="#aaa">Distribution Hub</text>
    
    <circle cx="280" cy="690" r="5" fill="#14b8a6" opacity="0.5"/>
    <text x="295" y="695" font-family="system-ui, sans-serif" font-size="11" fill="#aaa">Delivery Point</text>
  </g>
  
  <!-- Footer -->
  <text x="60" y="705" font-family="system-ui, sans-serif" font-size="12" fill="#666">
    Last updated: Real-time fleet tracking active
  </text>
</svg>