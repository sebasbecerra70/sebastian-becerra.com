  <text x=\"130\" y=\"800\" font-family=\"Arial\" font-size=\"10\" fill=\"white\">Throughput: 12.4K units/day • Network Utilization: 78% • Bottlenecks: 2 identified</text>
  <text x=\"130\" y=\"825\" font-family=\"Arial\" font-size=\"10\" fill=\"white\">Average Latency: 0.8s • Data Flow: Optimized • Redundancy: Full backup available</text>
