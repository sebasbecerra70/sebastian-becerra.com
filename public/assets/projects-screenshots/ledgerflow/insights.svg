<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1629;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2139;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#151a2f;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bgGradient)"/>
  <rect width="1600" height="120" fill="url(#headerGrad)"/>
  <text x="60" y="75" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white">LedgerFlow</text>
  <text x="60" y="110" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.8)">Financial Analysis & Insights</text>
  <!-- KPI Cards -->
  <rect x="60" y="150" width="260" height="140" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2"/>
  <text x="85" y="185" font-family="Arial, sans-serif" font-size="13" fill="#10b981" font-weight="bold">Gross Margin</text>
  <text x="85" y="240" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#10b981">62.4%</text>
  <text x="85" y="260" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">↑ 2.1% improvement</text>
  <rect x="360" y="150" width="260" height="140" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2"/>
  <text x="385" y="185" font-family="Arial, sans-serif" font-size="13" fill="#10b981" font-weight="bold">Operating Margin</text>
  <text x="385" y="240" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#10b981">24.2%</text>
  <text x="385" y="260" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">↑ 1.8% from last period</text>
  <rect x="660" y="150" width="260" height="140" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2"/>
  <text x="685" y="185" font-family="Arial, sans-serif" font-size="13" fill="#10b981" font-weight="bold">Current Ratio</text>
  <text x="685" y="240" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#10b981">1.86x</text>
  <text x="685" y="260" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)\">Healthy liquidity</text>
  <rect x=\"960\" y=\"150\" width=\"260\" height=\"140\" rx=\"12\" fill=\"url(#cardGrad)\" stroke=\"#10b981\" stroke-width=\"2\"/>
  <text x=\"985\" y=\"185\" font-family=\"Arial, sans-serif\" font-size=\"13\" fill=\"#10b981\" font-weight=\"bold\">Debt-to-Equity</text>
  <text x=\"985\" y=\"240\" font-family=\"Arial, sans-serif\" font-size=\"48\" font-weight=\"bold\" fill=\"#10b981\">1.00x</text>
  <text x=\"985\" y=\"260\" font-family=\"Arial, sans-serif\" font-size=\"11\" fill=\"rgba(255,255,255,0.6)\">Well-balanced</text>
  <rect x=\"1260\" y=\"150\" width=\"200\" height=\"140\" rx=\"12\" fill=\"url(#cardGrad)\" stroke=\"#10b981\" stroke-width=\"2\"/>
  <text x=\"1280\" y=\"185\" font-family=\"Arial, sans-serif\" font-size=\"13\" fill=\"#10b981\" font-weight=\"bold\">ROE</text>
  <text x=\"1280\" y=\"240\" font-family=\"Arial, sans-serif\" font-size=\"44\" font-weight=\"bold\" fill=\"#10b981\">28.3%</text>
  <text x=\"1280\" y=\"260\" font-family=\"Arial, sans-serif\" font-size=\"11\" fill=\"rgba(255,255,255,0.6)\">Strong returns</text>
  <!-- Main Content Area -->
  <rect x=\"60\" y=\"330\" width=\"720\" height=\"600\" rx=\"12\" fill=\"url(#cardGrad)\" stroke=\"#10b981\" stroke-width=\"1\" opacity=\"0.8\"/>
  <text x=\"100\" y=\"370\" font-family=\"Arial, sans-serif\" font-size=\"16\" font-weight=\"bold\" fill=\"#10b981\">Income Breakdown by Department</text>
  <!-- Pie Chart for Revenue Distribution -->
  <g>
    <!-- Sales Revenue Pie (60%) -->
    <path d=\"M 280 520 L 280 380 A 140 140 0 1 1 125 641\" fill=\"rgba(16,185,129,0.3)\" stroke=\"#10b981\" stroke-width=\"3\"/>
    <circle cx=\"280\" cy=\"520\" r=\"5\" fill=\"#10b981\"/>
    <!-- Operations Revenue Pie (20%) -->
    <path d=\"M 280 520 L 125 641 A 140 140 0 0 1 120 520\" fill=\"rgba(59,130,246,0.3)\" stroke=\"#3b82f6\" stroke-width=\"3\"/>
    <!-- Services Revenue Pie (15%) -->
    <path d=\"M 280 520 L 120 520 A 140 140 0 0 1 175 390\" fill=\"rgba(245,158,11,0.3)\" stroke=\"#f59e0b\" stroke-width=\"3\"/>
    <!-- Other Revenue Pie (5%) -->
    <path d=\"M 280 520 L 175 390 A 140 140 0 0 1 280 380\" fill=\"rgba(239,68,68,0.3)\" stroke=\"#ef4444\" stroke-width=\"3\"/>
    <!-- Center circle -->
    <circle cx=\"280\" cy=\"520\" r=\"60\" fill=\"url(#cardGrad)\"/>
    <text x=\"280\" y=\"525\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"20\" font-weight=\"bold\" fill=\"#10b981\">$1.4B</text>
    <text x=\"280\" y=\"542\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"9\" fill=\"rgba(255,255,255,0.6)\">Total</text>
  </g>
  <!-- Legend -->
  <rect x=\"100\" y=\"670\" width=\"160\" height=\"30\" fill=\"rgba(16,185,129,0.2)\" rx=\"4\"/>
  <text x=\"120\" y=\"690\" font-family=\"Arial\" font-size=\"10\" fill=\"#10b981\">Sales: 60% ($840M)</text>
  <rect x=\"100\" y=\"710\" width=\"160\" height=\"30\" fill=\"rgba(59,130,246,0.2)\" rx=\"4\"/>
  <text x=\"120\" y=\"730\" font-family=\"Arial\" font-size=\"10\" fill=\"#3b82f6\">Operations: 20% ($280M)</text>
  <rect x=\"100\" y=\"750\" width=\"160\" height=\"30\" fill=\"rgba(245,158,11,0.2)\" rx=\"4\"/>
  <text x=\"120\" y=\"770\" font-family=\"Arial\" font-size=\"10\" fill=\"#f59e0b\">Services: 15% ($210M)</text>
  <rect x=\"100\" y=\"790\" width=\"160\" height=\"30\" fill=\"rgba(239,68,68,0.2)\" rx=\"4\"/>
  <text x=\"120\" y=\"810\" font-family=\"Arial\" font-size=\"10\" fill=\"#ef4444\">Other: 5% ($70M)</text>
  <!-- Right Side - Expense Analysis -->
  <rect x=\"840\" y=\"330\" width=\"700\" height=\"600\" rx=\"12\" fill=\"url(#cardGrad)\" stroke=\"#10b981\" stroke-width=\"1\" opacity=\"0.8\"/>
  <text x=\"880\" y=\"370\" font-family=\"Arial, sans-serif\" font-size=\"16\" font-weight=\"bold\" fill=\"#10b981\">Expense Distribution</text>
  <!-- Expense Pie Chart -->
  <g>
    <!-- Cost of Goods Sold (45%) -->
    <path d=\"M 1240 520 L 1240 380 A 140 140 0 0 1 1372 457\" fill=\"rgba(239,68,68,0.3)\" stroke=\"#ef4444\" stroke-width=\"3\"/>
    <!-- Operating Expenses (28%) -->
    <path d=\"M 1240 520 L 1372 457 A 140 140 0 0 1 1240 660\" fill=\"rgba(249,115,22,0.3)\" stroke=\"#f97316\" stroke-width=\"3\"/>
    <!-- R&D (15%) -->
    <path d=\"M 1240 520 L 1240 660 A 140 140 0 0 1 1150 550\" fill=\"rgba(59,130,246,0.3)\" stroke=\"#3b82f6\" stroke-width=\"3\"/>
    <!-- Admin (12%) -->
    <path d=\"M 1240 520 L 1150 550 A 140 140 0 0 1 1240 380\" fill=\"rgba(107,114,128,0.3)\" stroke=\"#6b7280\" stroke-width=\"3\"/>
    <!-- Center circle -->
    <circle cx=\"1240\" cy=\"520\" r=\"60\" fill=\"url(#cardGrad)\"/>
    <text x=\"1240\" y=\"525\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"20\" font-weight=\"bold\" fill=\"#ef4444\">$1.1B</text>
    <text x=\"1240\" y=\"542\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"9\" fill=\"rgba(255,255,255,0.6)\">Total</text>
  </g>
  <!-- Expense Legend -->
  <rect x=\"880\" y=\"670\" width=\"160\" height=\"30\" fill=\"rgba(239,68,68,0.2)\" rx=\"4\"/>
  <text x=\"900\" y=\"690\" font-family=\"Arial\" font-size=\"10\" fill=\"#ef4444\">COGS: 45% ($495M)</text>
  <rect x=\"880\" y=\"710\" width=\"160\" height=\"30\" fill=\"rgba(249,115,22,0.2)\" rx=\"4\"/>
  <text x=\"900\" y=\"730\" font-family=\"Arial\" font-size=\"10\" fill=\"#f97316\">OpEx: 28% ($308M)</text>
  <rect x=\"880\" y=\"750\" width=\"160\" height=\"30\" fill=\"rgba(59,130,246,0.2)\" rx=\"4\"/>
  <text x=\"900\" y=\"770\" font-family=\"Arial\" font-size=\"10\" fill=\"#3b82f6\">R&D: 15% ($165M)</text>
  <rect x=\"880\" y=\"790\" width=\"160\" height=\"30\" fill=\"rgba(107,114,128,0.2)\" rx=\"4\"/>
  <text x=\"900\" y=\"810\" font-family=\"Arial\" font-size=\"10\" fill=\"#6b7280\">Admin: 12% ($132M)</text>
  <!-- Financial Ratios Table -->
  <rect x=\"1060\" y=\"670\" width=\"480\" height=\"160\" fill=\"rgba(16,185,129,0.05)\" rx=\"8\"/>
  <text x=\"1080\" y=\"695\" font-family=\"Arial\" font-size=\"11\" font-weight=\"bold\" fill=\"#10b981\">Key Financial Ratios</text>
  <text x=\"1080\" y=\"720\" font-family=\"Arial\" font-size=\"9\" fill=\"white\">Profit Margin: 24.3% | Asset Turnover: 0.58x | Inventory Turnover: 8.2x</text>
  <text x=\"1080\" y=\"740\" font-family=\"Arial\" font-size=\"9\" fill=\"white\">Quick Ratio: 1.42x | Return on Assets (ROA): 14.2% | Free Cash Flow: $285M</text>
  <text x=\"1080\" y=\"760\" font-family=\"Arial\" font-size=\"9\" fill=\"white\">Working Capital: $360M | Interest Coverage: 12.4x | Days Sales Outstanding: 28d</text>
  <text x=\"1080\" y=\"780\" font-family=\"Arial\" font-size=\"9\" fill=\"white\">Debt Service Coverage: 5.8x | Cash Conversion Cycle: 35d | EBITDA Margin: 32.1%</text>
  <text x=\"1080\" y=\"800\" font-family=\"Arial\" font-size=\"9\" fill=\"#10b981\">Overall Assessment: Strong financial health with excellent liquidity and profitability</text>
  <rect x=\"0\" y=\"960\" width=\"1600\" height=\"40\" fill=\"rgba(0,0,0,0.3)\"/>
  <text x=\"60\" y=\"985\" font-family=\"Arial, sans-serif\" font-size=\"11\" fill=\"rgba(255,255,255,0.5)\">Last updated: Today at 14:32 UTC</text>
  <text x=\"1450\" y=\"985\" font-family=\"Arial, sans-serif\" font-size=\"11\" fill=\"#10b981\">Financial reports verified and audited</text>
</svg>