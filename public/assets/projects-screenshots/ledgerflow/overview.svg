  <text x=\"1380\" y=\"480\" font-family=\"Arial\" font-size=\"8\" fill=\"white\">Assets:</text>
  <text x=\"1380\" y=\"495\" font-family=\"Arial\" font-size=\"9\" font-weight=\"bold\" fill=\"#10b981\">$2,400M</text>
