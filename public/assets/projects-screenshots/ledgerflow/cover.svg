<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ledgerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="ledgerChartGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.05" />
    </linearGradient>
    <filter id="glowLedger">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="720" fill="#0a1f1f"/>
  <rect width="1280" height="720" fill="url(#ledgerGradient)"/>
  
  <!-- Header -->
  <rect width="1280" height="80" fill="#0d3a2c"/>
  <rect width="1280" height="2" fill="#10b981"/>
  
  <!-- Title -->
  <text x="60" y="55" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#10b981">
    LedgerFlow
  </text>
  <text x="60" y="72" font-family="system-ui, sans-serif" font-size="13" fill="#10b981" opacity="0.6">
    Intelligent Financial Management Platform
  </text>
  
  <!-- Metrics Grid -->
  <!-- Total Balance Card -->
  <g filter="url(#glowLedger)">
    <rect x="60" y="120" width="270" height="140" fill="#0d3a2c" stroke="#10b981" stroke-width="1" rx="8"/>
    <text x="80" y="145" font-family="system-ui, sans-serif" font-size="13" fill="#10b981" opacity="0.7">Total Balance</text>
    <text x="80" y="180" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#10b981">$2.3M</text>
    <text x="80" y="225" font-family="system-ui, sans-serif" font-size="12" fill="#888">↑ 12.5% YoY growth</text>
  </g>
  
  <!-- Transactions Card -->
  <g filter="url(#glowLedger)">
    <rect x="360" y="120" width="270" height="140" fill="#0d3a2c" stroke="#10b981" stroke-width="1" rx="8"/>
    <text x="380" y="145" font-family="system-ui, sans-serif" font-size="13" fill="#10b981" opacity="0.7">Transactions</text>
    <text x="380" y="180" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#10b981">24.5K</text>
    <text x="380" y="225" font-family="system-ui, sans-serif" font-size="12" fill="#888">This month processed</text>
  </g>
  
  <!-- Reconciliation Card -->
  <g filter="url(#glowLedger)">
    <rect x="660" y="120" width="270" height="140" fill="#0d3a2c" stroke="#10b981" stroke-width="1" rx="8"/>
    <text x="680" y="145" font-family="system-ui, sans-serif" font-size="13" fill="#10b981" opacity="0.7">Reconciliation</text>
    <text x="680" y="180" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#10b981">99.8%</text>
    <text x="680" y="225" font-family="system-ui, sans-serif" font-size="12" fill="#888">Accuracy rate maintained</text>
  </g>
  
  <!-- Status Card -->
  <g filter="url(#glowLedger)">
    <rect x="960" y="120" width="260" height="140" fill="#0d3a2c" stroke="#10b981" stroke-width="1" rx="8"/>
    <text x="980" y="145" font-family="system-ui, sans-serif" font-size="13" fill="#10b981" opacity="0.7">System Status</text>
    <text x="980" y="180" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#10b981">Healthy</text>
    <circle cx="1015" cy="160" r="6" fill="#10b981" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="980" y="225" font-family="system-ui, sans-serif" font-size="12" fill="#888">All systems operational</text>
  </g>
  
  <!-- 30-day Cash Flow Chart -->
  <g>
    <text x="60" y="305" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e0e0e0">
      30-Day Cash Flow Trend
    </text>
    
    <!-- Chart Background -->
    <rect x="60" y="330" width="1160" height="350" fill="#0d3a2c" stroke="#10b981" stroke-width="1" rx="8" opacity="0.5"/>
    
    <!-- Grid Lines -->
    <line x1="60" y1="480" x2="1220" y2="480" stroke="#10b981" stroke-width="0.5" opacity="0.2"/>
    <line x1="60" y1="565" x2="1220" y2="565" stroke="#10b981" stroke-width="0.5" opacity="0.2"/>
    <line x1="60" y1="650" x2="1220" y2="650" stroke="#10b981" stroke-width="0.5" opacity="0.2"/>
    
    <!-- Gradient Fill Area -->
    <path d="M 80 630 L 120 570 L 160 510 L 200 490 L 240 460 L 280 430 L 320 450 L 360 390 L 400 360 L 440 370 L 480 350 L 520 330 L 560 390 L 600 370 L 640 350 L 680 390 L 720 340 L 760 320 L 800 370 L 840 340 L 880 300 L 920 350 L 960 320 L 1000 290 L 1040 330 L 1080 300 L 1120 340 L 1160 320 L 1200 360 L 1200 680 L 80 680 Z" 
          fill="url(#ledgerChartGradient)" opacity="0.6"/>
    
    <!-- Line Chart -->
    <polyline points="80,630 120,570 160,510 200,490 240,460 280,430 320,450 360,390 400,360 440,370 480,350 520,330 560,390 600,370 640,350 680,390 720,340 760,320 800,370 840,340 880,300 920,350 960,320 1000,290 1040,330 1080,300 1120,340 1160,320 1200,360" 
                  stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowLedger)"/>
    
    <!-- Axis Labels -->
    <text x="75" y="710" font-family="system-ui, sans-serif" font-size="11" fill="#666">Day 1</text>
    <text x="1180" y="710" font-family="system-ui, sans-serif" font-size="11" fill="#666">Day 30</text>
    <text x="50" y="365" font-family="system-ui, sans-serif" font-size="11" fill="#666">High</text>
    <text x="50" y="680" font-family="system-ui, sans-serif" font-size="11" fill="#666">Low</text>
  </g>
  
  <!-- Footer -->
  <text x="60" y="705" font-family="system-ui, sans-serif" font-size="12" fill="#666">
    Last updated: Real-time financial data
  </text>
</svg>