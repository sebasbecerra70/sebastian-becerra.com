<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1629;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b91c1c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2139;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#151a2f;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bgGradient)"/>
  <rect width="1600" height="120" fill="url(#headerGrad)"/>
  <text x="60" y="75" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white">Sentinel-Risk</text>
  <text x="60" y="110" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.8)">Risk Matrix & Threat Classification</text>
  <rect x="60" y="150" width="280" height="140" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="2"/>
  <text x="85" y="185" font-family="Arial, sans-serif" font-size="13" fill="#ef4444" font-weight="bold">Total Risks</text>
  <text x="85" y="240" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ef4444">24</text>
  <text x="85" y="260" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Across 8 categories</text>
  <rect x="380" y="150" width="280" height="140" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="2"/>
  <text x="405" y="185" font-family="Arial, sans-serif" font-size="13" fill="#ef4444" font-weight="bold">Critical Risks</text>
  <text x="405" y="240" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ef4444">3</text>
  <text x="405" y="260" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Require immediate action</text>
  <rect x="700" y="150" width="280" height="140" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="2"/>
  <text x="725" y="185" font-family="Arial, sans-serif" font-size="13" fill="#ef4444" font-weight="bold">Mitigated Risks</text>
  <text x="725" y="240" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#10b981">18</text>
  <text x="725" y="260" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Status: Under control</text>
  <rect x="1020" y="150" width="280" height="140" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="2"/>
  <text x="1045" y="185" font-family="Arial, sans-serif" font-size="13" fill="#ef4444" font-weight="bold">Risk Trend</text>
  <text x="1045" y="235" font-family="Arial, sans-serif" font-size="35" font-weight="bold" fill="#fbbf24">↑ 8%</text>
  <text x="1045" y="260" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">vs previous month</text>
  <rect x="1340" y="150" width="200" height="140" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="2"/>
  <text x="1360" y="185" font-family="Arial, sans-serif" font-size="13" fill="#ef4444" font-weight="bold">Risk Velocity</text>
  <circle cx="1440" cy="230" r="8" fill="#fbbf24"/>
  <text x="1440" y="245" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fbbf24">Increasing</text>
  <rect x="60" y="330" width="1480" height="600" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1" opacity="0.8"/>
  <text x="100" y="375" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ef4444">Risk Matrix: Likelihood vs Impact</text>
  <!-- Matrix Grid -->
  <line x1="300" y1="420" x2="300" y2="850" stroke="#ef4444" stroke-width="2" opacity="0.3"/>
  <line x1="600" y1="420" x2="600" y2="850" stroke="#ef4444" stroke-width="2" opacity="0.3"/>
  <line x1="900" y1="420" x2="900" y2="850" stroke="#ef4444" stroke-width="2" opacity="0.3"/>
  <line x1="1200" y1="420" x2="1200" y2="850" stroke="#ef4444" stroke-width="2" opacity="0.3"/>
  <line x1="100" y1="520" x2="1500" y2="520" stroke="#ef4444" stroke-width="2" opacity="0.3"/>
  <line x1="100" y1="670" x2="1500" y2="670" stroke="#ef4444" stroke-width="2" opacity="0.3"/>
  <!-- High Impact, High Likelihood (Red) -->
  <circle cx="1350" cy="450" r="35" fill="#ef4444" opacity="0.8"/>
  <text x="1350" y="460" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Critical</text>
  <text x="1350" y="475" text-anchor="middle" font-family="Arial" font-size="10" fill="white">3 risks</text>
  <!-- High Impact, Medium Likelihood (Orange) -->
  <circle cx="900" cy="450" r="28" fill="#f97316" opacity="0.8"/>
  <text x="900" y="458" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">High</text>
  <text x="900" y="472" text-anchor="middle" font-family="Arial" font-size="9" fill="white">4 risks</text>
  <!-- Medium Impact, High Likelihood (Yellow) -->
  <circle cx="1350" cy="595" r="25" fill="#fbbf24" opacity="0.8"/>
  <text x="1350" y="603" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#0a0f1f">Moderate</text>
  <text x="1350" y="616" text-anchor="middle" font-family="Arial" font-size="8" fill="#0a0f1f">7 risks</text>
  <!-- Low Impact, Low Likelihood (Green) -->
  <circle cx="150" cy="740" r="22" fill="#10b981" opacity="0.8"/>
  <text x="150" y="748" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="white">Low</text>
  <text x="150" y="760" text-anchor="middle" font-family="Arial" font-size="8" fill="white">10 risks</text>
  <!-- Axis Labels -->
  <text x="50" y="440" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.7)" font-weight="bold">High Impact</text>
  <text x="50" y="750" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.7)" font-weight="bold">Low Impact</text>
  <text x="200" y="900" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.7)">Low Likelihood</text>
  <text x="1400" y="900" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.7)">High Likelihood</text>
  <!-- Risk Categories List -->
  <rect x="100" y="750" width="350" height="80" fill="rgba(239,68,68,0.1)" rx="4"/>
  <text x="120" y="775" font-family="Arial" font-size="12" font-weight="bold" fill="#ef4444">Critical Category</text>
  <text x="120" y="795" font-family="Arial" font-size="10" fill="white">Security: Ransomware, Data Breach</text>
  <text x="120" y="810" font-family="Arial" font-size="10" fill="white">Infrastructure: Complete system failure</text>
  <rect x="500" y="750" width="350" height="80" fill="rgba(249,115,22,0.1)" rx="4"/>
  <text x="520" y="775" font-family="Arial" font-size="12" font-weight="bold" fill="#f97316">High Risk Category</text>
  <text x="520" y="795" font-family="Arial" font-size="10" fill="white">Malware, SQL Injection, Unauthorized</text>
  <text x="520" y="810" font-family="Arial" font-size="10" fill="white">API endpoint compromise, Data loss</text>
  <rect x="900" y="750" width="350" height="80" fill="rgba(59,130,246,0.1)" rx="4"/>
  <text x="920" y="775" font-family="Arial" font-size="12" font-weight="bold" fill="#3b82f6">Medium Risk Category</text>
  <text x="920" y="795" font-family="Arial" font-size="10" fill="white">Phishing, Misconfiguration, Exposure</text>
  <text x="920" y="810" font-family="Arial" font-size="10" fill="white">Weak encryption, Access violations</text>
  <rect x="1300" y="750" width="240" height="80" fill="rgba(16,185,129,0.1)" rx="4"/>
  <text x="1320" y="775" font-family="Arial" font-size="12" font-weight="bold" fill="#10b981">Low Risk Category</text>
  <text x="1320" y="795" font-family="Arial" font-size="10" fill="white">Outdated libraries, Policy gaps</text>
  <text x="1320" y="810" font-family="Arial" font-size="10" fill="white">Minor vulnerabilities, Documentation</text>
  <rect x="0" y="960" width="1600" height="40" fill="rgba(0,0,0,0.3)"/>
  <text x="60" y="985" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Last updated: Today at 14:32 UTC</text>
  <text x="1450" y="985" font-family="Arial, sans-serif" font-size="11" fill="#ef4444">⚠ 3 Critical items</text>
</svg>