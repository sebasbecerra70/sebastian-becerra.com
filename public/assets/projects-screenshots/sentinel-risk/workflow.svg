  <text x="170" y="245" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Detection</text>
  <text x="170" y="260" text-anchor="middle" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.6)">Threat identified</text>
  <!-- Arrow -->
  <path d="M 260 220 L 310 220" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <polygon points="320,220 310,215 310,225" fill="#ef4444"/>
  <!-- Stage 2: Analysis -->
