  <text x="420" y="245" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Analysis</text>
  <text x="420" y="260" text-anchor="middle" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.6)">Assess impact</text>
  <!-- Arrow -->
  <path d="M 510 220 L 560 220" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <polygon points="570,220 560,215 560,225" fill="#ef4444"/>
