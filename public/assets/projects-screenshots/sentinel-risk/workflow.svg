  <line x1=\"130\" y1=\"670\" x2=\"1450\" y2=\"670\" stroke=\"#ef4444\" stroke-width=\"1\" opacity=\"0.3\"/>
  <text x=\"130\" y=\"700\" font-family=\"Arial\" font-size=\"11\" fill=\"white\">INC-2024-0156 | Malware detected | Status: In Containment | Time: 2h 18m | Priority: Critical | Assigned: Security Team A</text>
  <text x=\"130\" y=\"725\" font-family=\"Arial\" font-size=\"11\" fill=\"white\">INC-2024-0155 | Unauthorized access | Status: Analysis | Time: 4h 52m | Priority: High | Assigned: Security Team B</text>
  <text x=\"130\" y=\"750\" font-family=\"Arial\" font-size=\"11\" fill=\"white\">INC-2024-0154 | Data exfiltration attempt | Status: Contained | Time: 12h 34m | Priority: High | Assigned: Security Team C</text>
  <text x=\"130\" y=\"775\" font-family=\"Arial\" font-size=\"11\" fill=\"white\">INC-2024-0153 | Policy violation | Status: Recovery | Time: 18h 12m | Priority: Medium | Assigned: Compliance Team</text>
  <text x=\"130\" y=\"800\" font-family=\"Arial\" font-size=\"11\" fill=\"white\">INC-2024-0152 | Vulnerability discovered | Status: Post-Mortem | Time: 3d 5h | Priority: Medium | Assigned: Engineering Team</text>
