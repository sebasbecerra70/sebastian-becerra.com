  <text x=\"890\" y=\"485\" font-family=\"Arial\" font-size=\"11\" fill=\"white\">SLA Target: 1 hour</text>
  <text x=\"890\" y=\"505\" font-family=\"Arial\" font-size=\"11\" fill=\"white\">Compliance: 92% on-time</text>
  <text x=\"890\" y=\"530\" font-family=\"Arial\" font-size=\"10\" fill=\"#10b981\">✓ Excellent performance</text>
  <text x=\"890\" y=\"565\" font-family=\"Arial\" font-size=\"10\" fill=\"rgba(255,255,255,0.7)\">Stakeholders notified: 12</text>
  <text x=\"890\" y=\"580\" font-family=\"Arial\" font-size=\"10\" fill=\"rgba(255,255,255,0.7)\">Status updates: 24</text>
