  <text x=\"1270\" y=\"485\" font-family=\"Arial\" font-size=\"11\" fill=\"white\">Follow-ups pending: 3</text>
  <text x=\"1270\" y=\"505\" font-family=\"Arial\" font-size=\"11\" fill=\"white\">Recommendations: 6</text>
  <text x=\"1270\" y=\"530\" font-family=\"Arial\" font-size=\"10\" fill=\"#3b82f6\">In review</text>
  <text x=\"1270\" y=\"565\" font-family=\"Arial\" font-size=\"10\" fill=\"rgba(255,255,255,0.7)\">Timeline: 5-7 days</text>
  <text x=\"1270\" y=\"580\" font-family=\"Arial\" font-size=\"10\" fill=\"rgba(255,255,255,0.7)\">Budget impact: TBD</text>
