  <text x="670" y="245" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Containment</text>
  <text x="670" y="260" text-anchor="middle" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.6)">Isolate threat</text>
